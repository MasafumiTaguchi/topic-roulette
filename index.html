<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23306b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="しゃべるお題">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>しゃべるお題</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 配置: 画面の真ん中に大きなお題、親指の届く下に「次のお題」。種類の絞り込みは上、タイマーと履歴は下の補助 */
:root{
  --bg:#eef0f8; --card:#23306b; --card-ink:#ffffff; --card-sub:#c4cbf0; --ink:#171c3a; --sub:#5a6288; --line:#d5d9ee;
  --btn:#f2b03d; --btn-ink:#201600; --chip:#ffffff; --chip-on:#23306b; --chip-on-ink:#ffffff; --ok:#1f7a4d;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1226; --card:#2b3a86; --card-ink:#ffffff; --card-sub:#bcc6f7; --ink:#e9ecfb; --sub:#9aa3cf; --line:#252b52;
  --btn:#f2b03d; --btn-ink:#201600; --chip:#171b38; --chip-on:#f2b03d; --chip-on-ink:#201600; --ok:#65c796; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1226; --card:#2b3a86; --card-ink:#ffffff; --card-sub:#bcc6f7; --ink:#e9ecfb; --sub:#9aa3cf; --line:#252b52;
  --btn:#f2b03d; --btn-ink:#201600; --chip:#171b38; --chip-on:#f2b03d; --chip-on-ink:#201600; --ok:#65c796; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;padding-inline:16px;padding-block:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-family:var(--f-disp);font-size:18px;font-weight:900;margin:0}
.count{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding-block:12px}
.card{background:var(--card);color:var(--card-ink);border-radius:24px;padding:28px 22px 24px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.cat{font-size:13px;font-weight:700;color:var(--card-sub);letter-spacing:.08em}
.topic{font-family:var(--f-disp);font-weight:900;font-size:clamp(26px,7.4vw,36px);line-height:1.35;text-wrap:balance;overflow-wrap:anywhere;margin:0}
.dig{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--card-sub)}
.dig li::before{content:"・"}
.tools{display:flex;gap:8px;margin-top:12px}
.tools button{flex:1;min-height:46px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;font:inherit;font-size:14px}
.tools button[aria-pressed="true"]{border-color:var(--btn);color:var(--ink);font-weight:700}
.timer{margin-top:10px;display:flex;align-items:center;gap:10px}
.timer .bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.timer .bar i{display:block;height:100%;width:0;background:var(--btn)}
.timer .t{font-variant-numeric:tabular-nums;font-size:15px;min-width:50px;text-align:right}
.next{margin-top:12px;width:100%;min-height:64px;border:0;border-radius:18px;background:var(--btn);color:var(--btn-ink);font-family:var(--f-disp);font-weight:900;font-size:22px}
.next:active{transform:scale(.99)}
.sheet{margin-top:10px}
.sheet summary{cursor:pointer;color:var(--sub);font-size:14px;padding:8px 0;min-height:40px}
.sheet ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.sheet li{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.sheet li small{color:var(--sub)}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.topic{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="top"><h1>しゃべるお題</h1><span class="count" id="count"></span></div>
<div class="chips" id="chips" role="group" aria-label="お題の種類"></div>
<div class="stage">
  <div class="card" aria-live="polite">
    <div class="cat" id="cat"></div>
    <p class="topic" id="topic">下の「次のお題」を押してください</p>
    <ul class="dig" id="dig"></ul>
  </div>
  <div class="tools">
    <button id="fav" type="button" aria-pressed="false">♡ 残す</button>
    <button id="t1" type="button">1分</button>
    <button id="t3" type="button">3分</button>
    <button id="t5" type="button">5分</button>
  </div>
  <div class="timer" id="timer" hidden><div class="bar"><i id="bar"></i></div><span class="t" id="tt">0:00</span></div>
</div>
<button class="next" id="next" type="button">次のお題</button>
<details class="sheet"><summary id="hsum">履歴と残したお題</summary>
  <p class="count">残したお題</p><ul id="favs"></ul>
  <p class="count">さっきまでのお題</p><ul id="hist"></ul>
</details>

<script>
(function(){
"use strict";
var T=[
["思い出","子どもの頃、いちばん怒られたこと"],["思い出","初めて自分のお金で買ったもの"],["思い出","小学生のとき流行っていたもの"],["思い出","忘れられない食事"],
["思い出","今でも覚えている誰かの言葉"],["思い出","人生でいちばん緊張した日"],["思い出","引っ越しの思い出"],["思い出","初めてのアルバイト"],["思い出","子どもの頃の、夏休みの1日"],["思い出","昔住んでいた家の、においと音"],
["もしも","もし1週間だけ別の仕事ができるなら、何をする?"],["もしも","もし透明になれたら、まず何をする?"],["もしも","もし昔の自分に1つだけ伝えられるなら?"],["もしも","もし1日が40時間あったら、増えた16時間をどう使う?"],
["もしも","もし無人島に3つだけ持っていけるなら?"],["もしも","もし明日から魔法が1つ使えるなら?"],["もしも","もし1億円が今日もらえたら、最初の1週間は?"],["もしも","もし好きな時代に1日だけ行けるなら?"],["もしも","もし何でも1つだけ上手になれるなら?"],
["好み","最近いちばん美味しかったもの"],["好み","好きな音、好きなにおい"],["好み","好きな季節と、その理由"],["好み","理想の休日の午前中"],["好み","好きな道具や、手放せないもの"],["好み","何度でも見られる映画や動画"],["好み","好きな場所と、そこで何をするか"],["好み","最近ハマっていること"],
["いまの生活","今日いちばんどうでもいいと思ったこと"],["いまの生活","最近続いている習慣"],["いまの生活","最近やめたこと"],["いまの生活","部屋の中でいちばん好きな場所"],["いまの生活","毎日使っているもので、いちばん長持ちしているもの"],["いまの生活","最近、小さくうれしかったこと"],["いまの生活","最近ちょっとイラッとしたこと"],["いまの生活","朝、起きてから最初にすること"],
["考え方","自分は運がいいと思う場面"],["考え方","自分には向いていないと思うこと"],["考え方","時間が足りないと感じる瞬間"],["考え方","「普通」って、何だと思う?"],["考え方","自分の、ちょっと変なこだわり"],["考え方","最近、考えが変わったこと"],["考え方","「やらなきゃ」と思っているのにやっていないこと"],["考え方","大人になって、できるようになったこと"],
["お金と仕事","最近買って、よかったもの"],["お金と仕事","買って、後悔したもの"],["お金と仕事","仕事でいちばんうれしかった瞬間"],["お金と仕事","お金をもらえなくても、やりたいこと"],["お金と仕事","今の仕事で、まだ誰にも言っていないこと"],["お金と仕事","お金の使い方で、自分らしいところ"],["お金と仕事","人に教えられるくらい得意なこと"],
["体と健康","最近の睡眠について"],["体と健康","疲れたときの、自分なりの回復方法"],["体と健康","子どもの頃と変わった、体の感覚"],["体と健康","今日の体の調子を、天気にたとえると?"],["体と健康","ずっと続けられている運動や散歩"],["体と健康","おなかが空いたとき、真っ先に食べたいもの"],
["未来","1年後に、できるようになっていたいこと"],["未来","10年後の、普通の1日"],["未来","今のうちに始めておきたいこと"],["未来","おじいちゃん(おばあちゃん)になったらやりたい趣味"],["未来","1か月後の自分に、今日のうちに言っておきたいこと"],["未来","これから住んでみたい場所"],["未来","5年後の自分は、今日の自分に何と言う?"],
["変なお題","世の中の「なんでこれ有料なの?」と思うもの"],["変なお題","いちばん意味がないけど、好きなこと"],["変なお題","誰も気づいていない、便利な小ワザ"],["変なお題","近所にある、自分だけが知っている面白い場所"],["変なお題","動物になるなら、何になる?"],["変なお題","今日の自分を色にたとえると?"],["変なお題","名前をつけたい、日常のちょっとした現象"],["変なお題","世界から1つだけ消せるなら、何を消す?"],["変なお題","いま、一番ほしい発明品"],["変なお題","ロボットに教えたい、人間の変なところ"],
["人と話す","最近、誰かに言われて心に残った一言"],["人と話す","最近、ありがとうと言いたい人"],["人と話す","会うと元気になる人の特徴"],["人と話す","人に言えなくて、ちょっと困っていること"],["人と話す","最近会っていないけど、元気かなと思う人"],["人と話す","初めて会った人と、最初に話したい話題"],
["つくること","最近、つくっていて面白かったもの"],["つくること","作品づくりで、いちばん苦労したところ"],["つくること","見てくれる人に、1つだけ伝えるなら?"],["つくること","日常の中で、作品にしたら面白そうなこと"],["つくること","続けるコツだと思っていること"],["つくること","最近、いちばん勉強になったこと"]
];
var DIG=["それは、いつの話?","そのとき、誰がいた?","どう感じた?","いま思うと、どう思う?","いちばん細かく覚えている場面は?","誰かに教えるなら、何て言う?","それが好きな(嫌いな)理由は?","もう1つ、似たことを思い出せる?"];
var CATS=["すべて"].concat(T.map(function(x){return x[0]}).filter(function(c,i,a){return a.indexOf(c)===i}));
var S={cat:"すべて",bag:[],cur:null,favs:[],hist:[],tmr:null};
function $(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
S.favs=ls("sr_favs")||[];S.hist=ls("sr_hist")||[];S.cat=ls("sr_cat")||"すべて";S.seen=ls("sr_seen")||[];
function pool(){return T.filter(function(x){return S.cat==="すべて"||x[0]===S.cat})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var W1=["子どもの頃","中学・高校のとき","20代のころ","10年前","去年","先月","先週","昨日","今朝","いま"];
var W2=["食べ物","音","におい","場所","道具","人づきあい","買い物","移動","天気","お金","睡眠","仕事","遊び","部屋","言葉","失敗","約束","習慣","服","乗り物","お店","本や動画","連絡","贈り物","時間の使い方"];
var W3=["いちばん印象に残っている","今も覚えている","いま思うと笑える","ちょっと恥ずかしかった","誰にも言わなかった","好きだった","苦手だった","変わったと感じる","なくなって寂しい","もう一度やってみたい","人に話したことがない","いちばん長く続いている"];
var W4=["海と山","朝型と夜型","一人旅と団体旅行","新しいものと使い慣れたもの","安くて多いと高くて少ない","知らせる派と黙っておく派","計画する派と思いつきの派","電話と文章","家で過ごす休日と出かける休日","形に残るものと思い出に残るもの"];
function rp(a){return a[Math.floor(Math.random()*a.length)]}
function gen(){
  var k=Math.floor(Math.random()*5),t;
  if(k<2)t=rp(W1)+"の"+rp(W2)+"で、"+rp(W3)+"こと";
  else if(k==2)t="もし"+rp(W2)+"を1つだけ変えられるなら、何を変える?";
  else if(k==3)t=rp(W4)+"、どちらかを一生選ぶなら?その理由は?";
  else t="いまの"+rp(W2)+"について、良いところを3つ、気になるところを1つ挙げるなら?";
  return["自動お題",t]}
function refill(){var seen=S.seen;var left=pool().filter(function(x){return seen.indexOf(x[1])<0});
  if(!left.length){var b=[],u={};while(b.length<30){var g=gen();if(!u[g[1]]&&seen.indexOf(g[1])<0){u[g[1]]=1;b.push(g)}}left=b}
  S.bag=shuffle(left)}
function pick2(){var a=shuffle(DIG);return a.slice(0,2)}
function next(){
  if(!S.bag.length)refill();var x=S.bag.pop();S.cur=x;S.seen.push(x[1]);ls("sr_seen",S.seen.slice(-400));
  S.hist.unshift({c:x[0],t:x[1]});S.hist=S.hist.slice(0,20);ls("sr_hist",S.hist);stop();show();
}
function show(){
  var x=S.cur;if(!x)return;$("cat").textContent=x[0];$("topic").textContent=x[1];
  var d=$("dig");d.textContent="";pick2().forEach(function(q){var li=document.createElement("li");li.textContent=q;d.appendChild(li)});
  var on=S.favs.some(function(f){return f.t===x[1]});$("fav").setAttribute("aria-pressed",String(on));$("fav").textContent=on?"♥ 残した":"♡ 残す";
  var t=$("topic");t.style.animation="none";void t.offsetWidth;t.style.animation="";lists();
}
function lists(){
  var left=pool().filter(function(x){return S.seen.indexOf(x[1])<0}).length;
  $("count").textContent="∞ お題は無限に出ます";
  fill($("favs"),S.favs,"まだありません");fill($("hist"),S.hist.slice(1),"まだありません");
}
function fill(ul,arr,empty){ul.textContent="";if(!arr.length){var li=document.createElement("li");li.textContent=empty;ul.appendChild(li);return}
  arr.forEach(function(f){var li=document.createElement("li");li.textContent=f.t+" ";var s=document.createElement("small");s.textContent="("+f.c+")";li.appendChild(s);ul.appendChild(li)})}
function drawChips(){var c=$("chips");c.textContent="";CATS.forEach(function(n){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=n;b.setAttribute("aria-pressed",String(n===S.cat));
  b.onclick=function(){S.cat=n;ls("sr_cat",n);S.bag=[];drawChips();next()};c.appendChild(b)})}
$("next").onclick=next;
$("fav").onclick=function(){if(!S.cur)return;var t=S.cur[1],i=-1;S.favs.forEach(function(f,k){if(f.t===t)i=k});if(i>=0)S.favs.splice(i,1);else S.favs.unshift({c:S.cur[0],t:t});ls("sr_favs",S.favs);show()};
function stop(){if(S.tmr){clearInterval(S.tmr);S.tmr=null}$("timer").hidden=true;["t1","t3","t5"].forEach(function(i){$(i).removeAttribute("aria-pressed")})}
function start(min,id){stop();var total=min*60,t0=Date.now();$("timer").hidden=false;$(id).setAttribute("aria-pressed","true");
  function tick(){var e=Math.floor((Date.now()-t0)/1000),r=Math.max(0,total-e);$("bar").style.width=Math.min(100,e/total*100)+"%";
    $("tt").textContent=Math.floor(r/60)+":"+("0"+(r%60)).slice(-2);if(r<=0){clearInterval(S.tmr);S.tmr=null;$("tt").textContent="時間です";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
  tick();S.tmr=setInterval(tick,500)}
$("t1").onclick=function(){start(1,"t1")};$("t3").onclick=function(){start(3,"t3")};$("t5").onclick=function(){start(5,"t5")};
drawChips();lists();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
